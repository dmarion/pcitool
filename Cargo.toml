[package]
name = "pcitool"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dmarion/pcitool"
authors = ["dmarion"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
linkme = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
rustix = { version = "1.1", features = ["process"] }

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"

[package.metadata.deb]
maintainer = "Damjan Marion <damjan.marion@gmail.com>"
extended-description = """
PCI diagnostics helper"""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
  ["target/release/pcitool", "usr/bin/", "755"],
  ["target/release/completions/pcitool.bash", "usr/share/bash-completion/completions/pcitool", "644"],
  ["target/release/completions/_pcitool", "usr/share/zsh/site-functions/_pcitool", "644"]
]
